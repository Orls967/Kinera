name: Build, Test, and Deploy KINERA to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.13.1'

      - name: Run Rust unit & engineering validation tests
        run: cargo test --workspace

      - name: Run Rust Clippy lint check
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build kinera-wasm package
        run: wasm-pack build crates/kinera-wasm --target web --release --out-dir ../../apps/web/src/wasm-pkg

      - name: Install frontend dependencies
        run: npm --prefix apps/web ci

      - name: TypeScript typecheck
        run: npm --prefix apps/web run typecheck

      - name: Frontend ESLint check
        run: npm --prefix apps/web run lint

      - name: Run Vitest unit, schema & integration tests
        run: npm --prefix apps/web run test

      - name: Build production PWA bundle for GitHub Pages
        env:
          VITE_BASE_PATH: /Kinera/
        run: npm --prefix apps/web run build

      - name: Verify expected build artifacts
        run: |
          test -f apps/web/dist/index.html
          test -f apps/web/dist/404.html
          test -f apps/web/dist/sw.js
          test -f apps/web/dist/manifest.webmanifest
          ls apps/web/dist/assets/*.wasm

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
